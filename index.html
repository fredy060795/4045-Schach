<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schach</title>
<style>
  :root { --bs: min(92vw, 76vh, 640px); --light: #efdcb8; --dark: #b2865f; --bg: #1f2227; --panel: #2a2e35; --text: #e9e6e0; --accent: #e0b25a; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; flex-wrap: wrap; gap: 8px; }
  h1 { margin: 0; font-size: 1.4rem; letter-spacing: .04em; }
  #seat { font-weight: 600; color: var(--accent); }
  main { display: flex; gap: 24px; justify-content: center; align-items: flex-start; padding: 8px 16px 24px; flex-wrap: wrap; }
  #board { width: var(--bs); height: var(--bs); display: grid; grid-template: repeat(8, 1fr) / repeat(8, 1fr); border-radius: 6px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.45); user-select: none; }
  .sq { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .light { background: var(--light); } .dark { background: var(--dark); }
  .last.light { background: #f3e27a; } .last.dark { background: #d4bb4a; }
  .sel { box-shadow: inset 0 0 0 4px rgba(40,120,220,.85); }
  .check { background: radial-gradient(circle, #ff4b3a 0%, #e0332499 45%, transparent 75%) !important; }
  .tgt::after { content: ""; width: 30%; height: 30%; border-radius: 50%; background: rgba(20,30,40,.35); position: absolute; }
  .cap::after { content: ""; position: absolute; inset: 4%; border-radius: 50%; border: calc(var(--bs) / 110) solid rgba(20,30,40,.4); }
  .pc { font-size: calc(var(--bs) / 8 * .8); line-height: 1; font-family: "Segoe UI Symbol", "DejaVu Sans", "Noto Sans Symbols2", serif; position: relative; z-index: 1; pointer-events: none; }
  .pc.w { color: #fff; text-shadow: 0 0 1px #000, 0 0 1px #000, 0 0 1px #000, 0 2px 3px rgba(0,0,0,.5); }
  .pc.b { color: #15171a; text-shadow: 0 0 1px #fff8, 0 2px 3px rgba(0,0,0,.4); }
  .coord { position: absolute; font-size: calc(var(--bs) / 48); font-weight: 700; opacity: .75; pointer-events: none; }
  .coord.rank { top: 3px; left: 4px; } .coord.file { bottom: 2px; right: 4px; }
  .light .coord { color: var(--dark); } .dark .coord { color: var(--light); }
  aside { width: min(92vw, 320px); background: var(--panel); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  #status { font-size: 1.15rem; font-weight: 600; }
  #status.over { color: var(--accent); }
  #conn { color: #ff7b6b; font-size: .9rem; }
  .player { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; background: #ffffff0a; }
  .player.turn { outline: 2px solid var(--accent); }
  .player .caps { font-size: 1.1rem; letter-spacing: -2px; font-family: "Segoe UI Symbol", "DejaVu Sans", serif; }
  .tag { font-size: .8rem; opacity: .75; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  button { background: #3b414b; color: var(--text); border: 0; border-radius: 6px; padding: 8px 12px; font-size: .9rem; cursor: pointer; }
  button:hover { background: #4a515d; }
  button.primary { background: var(--accent); color: #1f2227; font-weight: 600; }
  #moves { margin: 0; padding-left: 2.2em; max-height: 260px; overflow-y: auto; font-family: ui-monospace, Consolas, monospace; font-size: .95rem; }
  #moves li span { display: inline-block; min-width: 5.5em; }
  .hidden { display: none !important; }
  #promo { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #promo .box { background: var(--panel); padding: 16px; border-radius: 10px; display: flex; gap: 10px; }
  #promo .box button { font-size: 3rem; padding: 4px 12px; background: var(--light); }
  .hint { font-size: .8rem; opacity: .6; line-height: 1.4; }
</style>
</head>
<body>
<header>
  <h1>♞ Schach</h1>
  <div id="seat"></div>
</header>
<main>
  <div id="board"></div>
  <aside>
    <div id="status">Verbinde …</div>
    <div id="conn"></div>
    <div id="pB" class="player"></div>
    <div id="pW" class="player"></div>
    <div class="btns">
      <button id="claim" class="primary">Freie Farbe auch hier spielen</button>
      <button id="flip">Brett drehen</button>
      <button id="resign">Aufgeben</button>
      <button id="reset">Neues Spiel</button>
      <button id="free">Plätze freigeben</button>
    </div>
    <ol id="moves"></ol>
    <div class="hint">Der erste Browser spielt Weiß, der zweite Schwarz – einfach die Adresse auf einem zweiten Gerät öffnen. Für zwei Personen an einem Gerät „Freie Farbe auch hier spielen“ klicken.</div>
  </aside>
</main>
<div id="promo" class="hidden"><div class="box"></div></div>

<script src="chess.js"></script>
<script>
const $ = s => document.querySelector(s);
const VS = '︎';
const GLY = { K: '♚', Q: '♛', R: '♜', B: '♝', N: '♞', P: '♟' };
const NAME = { w: 'Weiß', b: 'Schwarz' };

let token = sessionStorage.getItem('schachToken');
if (!token) {
  token = Array.from({ length: 24 }, () => 'abcdefghijklmnopqrstuvwxyz0123456789'[Math.random() * 36 | 0]).join('');
  sessionStorage.setItem('schachToken', token);
}

let srv = null, game = null, sel = -1, flip = false, userFlipped = false, busy = false, lastVersion = -1;

async function api(path, body = {}) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, ...body }) });
  return r.json();
}

async function poll() {
  try {
    const r = await fetch('/api/state?token=' + token, { cache: 'no-store' });
    onState(await r.json());
    $('#conn').textContent = '';
  } catch (e) {
    $('#conn').textContent = '⚠ Keine Verbindung zum Server';
  }
}

function onState(st, force) {
  srv = st;
  if (st.version !== lastVersion || force) {
    lastVersion = st.version;
    game = buildGame(st.moves);
    sel = -1;
    if (!userFlipped) flip = st.mine.length === 1 && st.mine[0] === 'b';
    render();
  }
}

function gameStatus() {
  const s = game.s, ls = legal(s), chk = inCheck(s, s.turn);
  const r = srv.result;
  if (r && r.type === 'resign') return { over: true, ls, text: `${NAME[r.loser]} hat aufgegeben – ${NAME[opp(r.loser)]} gewinnt` };
  if (!ls.length) return { over: true, ls, text: chk ? `Schachmatt – ${NAME[opp(s.turn)]} gewinnt!` : 'Patt – Remis' };
  if (insufficient(s.b)) return { over: true, ls, text: 'Remis – zu wenig Material' };
  if (s.half >= 100) return { over: true, ls, text: 'Remis – 50-Züge-Regel' };
  const k = s.keys[s.keys.length - 1];
  if (s.keys.filter(x => x === k).length >= 3) return { over: true, ls, text: 'Remis – dreifache Stellungswiederholung' };
  return { over: false, ls, text: `${NAME[s.turn]} am Zug${chk ? ' – Schach!' : ''}` };
}

function captured(b) {
  const start = { Q: 1, R: 2, B: 2, N: 2, P: 8 }, res = { w: '', b: '' };
  for (const col of 'wb') for (const t of 'QRBNP') {
    const n = start[t] - b.filter(x => x === col + t).length;
    for (let i = 0; i < n; i++) res[col] += GLY[t] + VS;
  }
  return res; // res[col] = verlorene Figuren dieser Farbe
}

function render() {
  const s = game.s, st = gameStatus();
  const myTurn = !st.over && srv.mine.includes(s.turn);
  const targets = sel >= 0 ? st.ls.filter(m => m.from === sel) : [];
  const ck = inCheck(s, s.turn) ? kingSq(s.b, s.turn) : -1;
  const board = $('#board');
  board.innerHTML = '';
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
    const sq = flip ? (7 - i) * 8 + (7 - j) : i * 8 + j;
    const r = sq >> 3, c = sq & 7;
    const d = document.createElement('div');
    d.className = 'sq ' + ((r + c) % 2 ? 'dark' : 'light');
    if (s.last && (sq === s.last.from || sq === s.last.to)) d.classList.add('last');
    if (sq === sel) d.classList.add('sel');
    if (sq === ck) d.classList.add('check');
    const t = targets.find(m => m.to === sq);
    if (t) d.classList.add(s.b[sq] || t.ep ? 'cap' : 'tgt');
    const p = s.b[sq];
    if (p) {
      const e = document.createElement('span');
      e.className = 'pc ' + p[0];
      e.textContent = GLY[p[1]] + VS;
      d.appendChild(e);
    }
    if (j === 0) d.insertAdjacentHTML('beforeend', `<span class="coord rank">${8 - r}</span>`);
    if (i === 7) d.insertAdjacentHTML('beforeend', `<span class="coord file">${'abcdefgh'[c]}</span>`);
    d.onclick = () => clickSq(sq, st, myTurn);
    board.appendChild(d);
  }

  $('#status').textContent = st.text;
  $('#status').classList.toggle('over', st.over);

  const cap = captured(s.b);
  for (const col of 'wb') {
    const el = col === 'w' ? $('#pW') : $('#pB');
    const who = srv.mine.includes(col) ? 'Du' : srv.seats[col] ? 'Gegner' : 'frei';
    el.innerHTML = `<div><b>${NAME[col]}</b> <span class="tag">(${who})</span></div><div class="caps">${cap[opp(col)]}</div>`;
    el.classList.toggle('turn', !st.over && s.turn === col);
  }
  // Schwarz oben, wenn Weiß unten steht
  const aside = $('aside');
  if (flip) aside.insertBefore($('#pW'), $('#pB')); else aside.insertBefore($('#pB'), $('#pW'));

  const m = srv.mine;
  $('#seat').textContent = m.length === 2 ? 'Du spielst beide Farben' : m.length === 1 ? `Du spielst ${NAME[m[0]]}` : 'Zuschauer';
  $('#claim').classList.toggle('hidden', srv.seats.w && srv.seats.b);
  $('#claim').textContent = m.length ? 'Freie Farbe auch hier spielen' : 'Mitspielen';
  $('#resign').classList.toggle('hidden', !m.length || st.over);
  $('#reset').classList.toggle('hidden', !m.length);

  const ol = $('#moves');
  ol.innerHTML = '';
  for (let i = 0; i < game.list.length; i += 2) {
    const li = document.createElement('li');
    li.innerHTML = `<span>${game.list[i]}</span><span>${game.list[i + 1] || ''}</span>`;
    ol.appendChild(li);
  }
  ol.scrollTop = ol.scrollHeight;
}

async function clickSq(sq, st, myTurn) {
  if (!myTurn || busy) return;
  const s = game.s;
  if (sel >= 0) {
    const cands = st.ls.filter(m => m.from === sel && m.to === sq);
    if (cands.length) {
      let promo = null;
      if (cands[0].promo) { promo = await askPromo(s.turn); if (!promo) return; }
      busy = true;
      try { onState(await api('/api/move', { from: sel, to: sq, promo, ply: srv.moves.length }), true); }
      catch (e) { $('#conn').textContent = '⚠ Zug konnte nicht gesendet werden'; }
      finally { busy = false; }
      return;
    }
  }
  const p = s.b[sq];
  sel = (p && p[0] === s.turn && sq !== sel) ? sq : -1;
  render();
}

function askPromo(color) {
  return new Promise(res => {
    const wrap = $('#promo'), box = wrap.querySelector('.box');
    box.innerHTML = '';
    for (const t of 'QRBN') {
      const b = document.createElement('button');
      b.innerHTML = `<span class="pc ${color}" style="font-size:3rem">${GLY[t]}${VS}</span>`;
      b.onclick = e => { e.stopPropagation(); wrap.classList.add('hidden'); res(t); };
      box.appendChild(b);
    }
    wrap.onclick = () => { wrap.classList.add('hidden'); res(null); };
    wrap.classList.remove('hidden');
  });
}

$('#flip').onclick = () => { flip = !flip; userFlipped = true; render(); };
$('#claim').onclick = async () => onState(await api('/api/claim'), true);
$('#resign').onclick = async () => { if (confirm('Wirklich aufgeben?')) onState(await api('/api/resign'), true); };
$('#reset').onclick = async () => {
  if (!confirm('Neues Spiel starten?')) return;
  const swap = srv.mine.length === 1 && confirm('Farben tauschen?');
  userFlipped = false;
  onState(await api('/api/reset', { swap }), true);
};
$('#free').onclick = async () => {
  if (!confirm('Alle Plätze freigeben und Spiel zurücksetzen?')) return;
  userFlipped = false;
  await api('/api/free');
  onState(await api('/api/join'), true);
};

(async () => {
  try { onState(await api('/api/join'), true); } catch (e) { $('#conn').textContent = '⚠ Keine Verbindung zum Server'; }
  setInterval(poll, 1000);
})();
</script>
</body>
</html>
